<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Meesho Ads Spend Monitor</title>
  <link rel="stylesheet" href="ui.css" />
  <style>
    body { width: 340px; }
    .wrap { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .stat b { display: block; font-size: 18px; }
    .meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12.5px; }
    .meta dt { color: var(--muted); }
    .meta dd { margin: 0; text-align: right; }
    .setup li { display: flex; gap: 8px; align-items: center; font-size: 13px; }
    .setup ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
    .tick { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); flex: none; }
    .tick.done { background: var(--ok); border-color: var(--ok); }
    .alerts { font-size: 12.5px; display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow: auto; }
    .alerts p { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
    footer { display: flex; gap: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="spread">
      <div class="stack-sm" style="gap:0">
        <strong id="label">Meesho Ads Monitor</strong>
        <span class="small muted" id="account">—</span>
      </div>
      <span class="chip" id="statusChip">…</span>
    </header>

    <div id="errorBox" class="callout danger small" hidden></div>

    <section id="setupBox" class="card setup stack-sm" hidden aria-labelledby="setupTitle" style="padding:12px">
      <strong id="setupTitle">Finish setup</strong>
      <ul id="setupList"></ul>
      <a class="btn btn-primary btn-sm" href="welcome.html" target="_blank">Continue setup guide</a>
    </section>

    <div class="stats">
      <div class="stat"><span class="small muted">Live campaigns</span><b id="liveCount">—</b></div>
      <div class="stat"><span class="small muted">Today&apos;s spend</span><b id="todayTotal">—</b></div>
    </div>

    <dl class="meta">
      <dt>Last success</dt><dd id="lastSuccess">—</dd>
      <dt>Next check</dt><dd id="nextCheck">—</dd>
    </dl>

    <div class="row">
      <button class="btn btn-primary" id="checkNow" type="button">Check now</button>
      <button class="btn btn-danger" id="resume" type="button" hidden>Resume monitoring</button>
    </div>
    <p class="status-line" id="checkStatus" role="status"></p>

    <section id="alertsBox" hidden aria-labelledby="alertsTitle" class="stack-sm">
      <strong id="alertsTitle" class="small">Recent alerts</strong>
      <div class="alerts" id="alertsList"></div>
    </section>

    <footer>
      <a href="options.html" target="_blank">Settings</a>
      <a href="welcome.html" target="_blank">Setup &amp; help guide</a>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
